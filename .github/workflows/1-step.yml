name: Step 1

on:
  push:
    paths:
      - '.claude/settings.json'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  exercise_checking:
    name: Start checking
    uses: ./.github/workflows/exercise-checking.yml

  test_settings:
    name: Test Claude configuration
    runs-on: ubuntu-latest
    needs: exercise_checking
    if: needs.exercise_checking.outputs.comment-id != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check settings.json exists
        run: |
          if [ ! -f ".claude/settings.json" ]; then
            echo "ERROR: .claude/settings.json not found"
            exit 1
          fi
          echo "settings.json exists"

      - name: Check secrets deny permission is configured
        run: |
          SETTINGS=".claude/settings.json"
          if ! grep -q '"Read(./secrets/\*\*)"' "$SETTINGS"; then
            echo "ERROR: deny rule for Read(./secrets/**) not found in $SETTINGS"
            exit 1
          fi
          echo "secrets deny permission is correctly configured"

  exercise_passed:
    name: Exercise passed
    needs: [exercise_checking, test_settings]
    if: needs.test_settings.result == 'success'
    uses: ./.github/workflows/exercise-passed.yml
    with:
      module-title: "Context Management"
      issue-url: ${{ needs.exercise_checking.outputs.issue-url }}
      issue-number: ${{ needs.exercise_checking.outputs.issue-number }}
      comment-id: ${{ needs.exercise_checking.outputs.comment-id }}

  exercise_failed:
    name: Exercise failed
    needs: [exercise_checking, test_settings]
    if: always() && needs.test_settings.result == 'failure'
    uses: ./.github/workflows/exercise-failed.yml
    with:
      comment-id: ${{ needs.exercise_checking.outputs.comment-id }}
      feedback-message: "The tests failed. Please check your project-level Claude configuration in `.claude/settings.json` and try again."
